name: Build
on:
    push:
        branches: [ '**' ]
        tags-ignore: [ v* ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5

            -   name: Set up JDK
                uses: actions/setup-java@v5
                with:
                    java-version: 25
                    distribution: 'temurin'

            -   name: Cache Maven packages
                uses: actions/cache@v4
                with:
                    path: ~/.m2/repository
                    key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
                    restore-keys: |
                        ${{ runner.os }}-m2-

            -   name: Create maven central settings.xml
                uses: whelk-io/maven-settings-xml-action@9dc09b23833fa9aa7f27b63db287951856f3433d

            -   name: Enable Testcontainers reuse
                # Several modules' integration tests each start their own Testcontainers Postgres
                # (data/analytics/import-ws). Reuse keeps a container alive (keyed by its config)
                # across those separate test JVMs within this one job/Docker daemon instead of
                # tearing down and re-starting an equivalent container per module.
                run: echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties

            -   name: Build with Maven
                run: mvn --batch-mode --update-snapshots install -DskipTests=false -f std-dive-logger-backend/pom.xml
