name: Analytics setup (dev)
run-name: "Analytics setup dev @ ${{ inputs.ref || 'main' }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref containing the analytics setup manifests
        type: string
        default: main
        required: true
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: analytics-setup-dev
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Check dev setup secrets
        env:
          ANALYTICS_KEY: ${{ secrets.ANALYTICS_TS_AUTHKEY }}
          RUNNER_KEY: ${{ secrets.TS_AUTHKEY }}
          HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
          KUBE_API: ${{ secrets.KUBE_API }}
          KUBE_CA: ${{ secrets.KUBE_CA }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
        run: |
          set -euo pipefail
          for name in ANALYTICS_KEY RUNNER_KEY HEADSCALE_URL KUBE_API KUBE_CA KUBE_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing dev setup value: $name. See deploy/analytics-dashboard.md."
              exit 1
            fi
          done

      - name: Configure Headscale TLS compatibility for the runner
        # Some network paths drop the larger ML-KEM ClientHello (tailscale/tailscale#20777).
        # Set this on the systemd daemon; an environment variable on the CLI does not reach it.
        run: |
          sudo mkdir -p /etc/systemd/system/tailscaled.service.d
          printf '%s\n' '[Service]' 'Environment="GODEBUG=tlsmlkem=0"' \
            | sudo tee /etc/systemd/system/tailscaled.service.d/90-headscale-tls.conf >/dev/null
          sudo systemctl daemon-reload
          if sudo systemctl is-active --quiet tailscaled; then
            sudo systemctl restart tailscaled
          fi

      - id: tailnet
        uses: SebastianThomas/homelab-actions/headscale-connect@v1
        with:
          auth-key: ${{ secrets.TS_AUTHKEY }}
          login-server: ${{ secrets.HEADSCALE_URL }}
          ping: kube-cp-01
          hostname: gha-dive-setup-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Diagnose Tailnet login failure
        if: failure() && steps.tailnet.outcome == 'failure'
        env:
          HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
        run: |
          if command -v tailscale >/dev/null; then
            sudo tailscale status --json | jq '{BackendState, Health}' || true
          fi
          for endpoint in health 'key?v=142'; do
            for family in -4 -6; do
              printf 'Headscale %s %s: ' "$endpoint" "$family"
              curl "$family" --silent --show-error --connect-timeout 5 --max-time 10 \
                --output /dev/null --write-out 'HTTP=%{http_code} peer=%{remote_ip} total=%{time_total}s\n' \
                "${HEADSCALE_URL%/}/$endpoint" || true
            done
          done
          sudo journalctl -u tailscaled --since '-4 minutes' --no-pager -o cat \
            | grep -Ei 'fetch control key|dial tcp|lookup .*:|network is unreachable|no route to host|TLS handshake|x509:|proxyconnect|connection refused|i/o timeout' \
            | tail -30 || true

      - name: Reconcile persistent analytics node key
        uses: SebastianThomas/homelab-actions/kube-secret@v1
        with:
          server: ${{ secrets.KUBE_API }}
          ca: ${{ secrets.KUBE_CA }}
          token: ${{ secrets.KUBE_TOKEN }}
          namespace: std-dive-logger-dev
          name: analytics-tailnet-authkey
          literals: |
            authkey=${{ secrets.ANALYTICS_TS_AUTHKEY }}

      - name: Reconcile analytics certificate and wait for TLS
        run: |
          set -euo pipefail
          if [ "$(kubectl auth can-i create certificates.cert-manager.io -n std-dive-logger-dev)" != yes ]; then
            echo '::error::Apply std-dive-logger-backend/std-dive-logger-analytics/manifests/bootstrap/dev with kubectl apply -k once as a cluster administrator.'
            exit 1
          fi
          kubectl -n std-dive-logger-dev apply -k std-dive-logger-backend/std-dive-logger-analytics/manifests/setup
          kubectl -n std-dive-logger-dev wait --for=condition=Ready certificate/analytics-tailnet-tls --timeout=300s
          kubectl -n std-dive-logger-dev get secret analytics-tailnet-tls -o name

      - name: Setup summary
        run: |
          echo 'Dev analytics Headscale key and TLS certificate reconciled. The node identity PVC is preserved.' >> "$GITHUB_STEP_SUMMARY"
          echo 'After deployment: https://std-dive-analytics-dev.ts.homelab.sthomas.ch/ops (Tailnet only).' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"

      - name: Disconnect runner from Tailnet
        if: always() && steps.tailnet.outcome != 'skipped'
        run: |
          if command -v tailscale >/dev/null; then
            sudo tailscale logout || true
          fi
