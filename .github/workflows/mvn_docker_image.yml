name: Build and push to Image Registry
on:
    push:
        tags:
            - v*

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5
                with:
                    ref: ${{ github.ref_name }}

            -   name: Set up JDK
                uses: actions/setup-java@v5
                with:
                    java-version: 25
                    distribution: 'temurin'

            -   name: Cache Maven packages
                uses: actions/cache@v4
                with:
                    path: ~/.m2/repository
                    key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
                    restore-keys: |
                        ${{ runner.os }}-m2-

            -   name: Create maven central settings.xml
                uses: whelk-io/maven-settings-xml-action@v22

            -   name: Build with Maven
                run: mvn --batch-mode --update-snapshots install -DskipTests=false -f std-dive-logger-backend/pom.xml

            # The docker matrix jobs below run on separate runners and need this run's own
            # freshly-built module jars (ch.sthomas:std-dive-logger-*) to resolve inter-module
            # dependencies for `mvn compile jib:build` - without re-running `mvn install` (and so
            # re-running every test) a second time per matrix entry. Only this subtree is uploaded
            # (not all of ~/.m2/repository) - third-party dependencies are already covered by the
            # pom.xml-hash-keyed cache restored in each matrix job below, and are unaffected by
            # which commit/tag is being built, so re-shipping them here would just waste time.
            -   name: Upload built module artifacts
                uses: actions/upload-artifact@v4
                with:
                    name: m2-reactor-artifacts
                    path: ~/.m2/repository/ch/sthomas/stddivelogger
                    retention-days: 1

    docker:
        runs-on: ubuntu-latest
        needs: [ build ]
        strategy:
            max-parallel: 4
            matrix:
                module: [ ws, autocomplete, analytics, import-ws ]
        steps:
            -   uses: actions/checkout@v5
                with:
                    ref: ${{ github.ref_name }}

            -   name: Set module name
                shell: bash
                run: |
                    echo "module=std-dive-logger-${{ matrix.module }}" >> $GITHUB_ENV

            -   name: Set TAG_NAME from image_tag
                shell: bash
                run: echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

            -   name: Replace all characters in `\/:"<>|?*` by `-` in TAG_NAME
                shell: bash
                run: echo "TAG_NAME=$(echo "$TAG_NAME" | sed 's/[\/:"<>|?*+]/-/g')" >> $GITHUB_ENV

            -   name: Set docker image tag and full name
                id: set_docker_image_tag_and_full_name
                shell: bash
                run: |
                    echo "docker_full_image_name=${{ env.module }}:${{ env.TAG_NAME }}" >> $GITHUB_ENV
                    echo "docker_image_tag=${{ env.TAG_NAME }}" >> $GITHUB_ENV

            -   name: Set VERSION from TAG_NAME
                shell: bash
                run: echo "VERSION=${{ env.docker_image_tag }}" >> $GITHUB_ENV

            # -   name: Strip leading `v` from VERSION
            #     shell: bash
            #     run: echo "VERSION=${VERSION##v}" >> $GITHUB_ENV

            -   name: Set default docker image
                shell: bash
                run: |
                    echo "DOCKER_BASE_IMAGE=eclipse-temurin:25" >> $GITHUB_ENV

            -   name: Login to DockerHub
                uses: docker/login-action@v2
                with:
                    username: ${{ secrets.container_registry_username }}
                    password: ${{ secrets.container_registry_password }}

            -   name: Set up JDK
                uses: actions/setup-java@v5
                with:
                    java-version: 25
                    distribution: 'temurin'

            -   name: Cache Maven packages
                uses: actions/cache@v4
                with:
                    path: ~/.m2/repository
                    key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
                    restore-keys: |
                        ${{ runner.os }}-m2-

            -   name: Create maven central settings.xml
                uses: whelk-io/maven-settings-xml-action@v22

            # Restored after the pom.xml-hash-keyed cache above, so this run's actual build output
            # always wins over anything (possibly stale, from an earlier run with an unchanged
            # pom.xml hash) the cache might contain for these same coordinates.
            -   name: Download built module artifacts
                uses: actions/download-artifact@v4
                with:
                    name: m2-reactor-artifacts
                    path: ~/.m2/repository/ch/sthomas/stddivelogger

            -   name: Build and push docker image
                shell: bash
                run: |
                    mvn --batch-mode compile jib:build \
                    -f std-dive-logger-backend/${{ env.module }}/pom.xml \
                    -Dconfig.deploy.env=dev -Dconfig.directory=/config \
                    -Dimage=${{ secrets.container_registry_username }}/${{ env.docker_full_image_name }} \
                    -Djib.from.image=${{ env.DOCKER_BASE_IMAGE }} \
                    -Djib.to.tags=latest,${{ env.VERSION }} \
                    -Djib.to.auth.username=${{ secrets.container_registry_username }} \
                    -Djib.to.auth.password=${{ secrets.container_registry_password }} \
                    -Djib.container.volumes='/config/' \
                    -Djib.container.environment=VERSION_TAG_NAME="${{ env.docker_image_tag }}",SPRING_CONFIG_LOCATION="/config/",SPRING_DOCKER_COMPOSE_ENABLED=false \
                    -Djib.container.entrypoint='sh,-c,exec java -XX:MinRAMPercentage=60.0 -XX:MaxRAMPercentage=80.0 $ADDITIONAL_JAVA_OPTS -cp @/app/jib-classpath-file @/app/jib-main-class-file $@'

    release:
        runs-on: ubuntu-latest
        needs: [ docker ]
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v5
                with:
                    ref: ${{ github.ref_name }}

            # A prerelease tag looks like vX.Y.Z-alpha.N / -dev.N / -rc.N; a plain vX.Y.Z is a
            # full release. Both are matched by this workflow's `tags: v*` trigger already.
            -   name: Determine prerelease flag
                id: prerelease
                shell: bash
                run: |
                    if [[ "${{ github.ref_name }}" =~ -(alpha|dev|rc)\.[0-9]+$ ]]; then
                        echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
                    else
                        echo "flag=" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Create GitHub Release
                shell: bash
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    gh release create "${{ github.ref_name }}" \
                        --title "${{ github.ref_name }}" \
                        --generate-notes \
                        ${{ steps.prerelease.outputs.flag }}
