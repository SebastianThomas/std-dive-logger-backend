name: db
run-name: "provision DB ${{ inputs.environment }} @ ${{ inputs.tag }}"

# Provisions/reconciles the CNPG Postgres+PostGIS Cluster for one environment.
# Deliberately separate from the app deploy - on demand, repeatable, never a
# side effect of an app release. The legacy DB is replayed once from a dump
# right after the Cluster first goes Ready (see README).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's Cluster to provision/reconcile
        required: true
        type: choice
        options:
          - dev
          - prod
      tag:
        description: Tag/ref to read the db/ manifests from (e.g. v1.2.3)
        required: true
        type: string

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: SebastianThomas/homelab-actions/headscale-connect@v1
        with:
          auth-key: ${{ secrets.TS_AUTHKEY }}
          login-server: ${{ secrets.HEADSCALE_URL }}
          ping: kube-cp-01
          hostname: gha-dive-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: "${{ inputs.environment }} CNPG Cluster"
        uses: SebastianThomas/homelab-actions/cnpg-cluster@v1
        with:
          server: ${{ secrets.KUBE_API }}
          ca: ${{ secrets.KUBE_CA }}
          token: ${{ secrets.KUBE_TOKEN }}
          namespace: std-dive-logger-${{ inputs.environment }}
          manifests: db/${{ inputs.environment }}
          timeout: 900s

      # std-dive-gas-tracker's role password (db/base/cluster.yaml `managed.roles`): generated once,
      # never rotated by a re-run. Basic-auth with the reload label, as CNPG requires. Runs after the
      # Cluster step (that step writes the kubeconfig); on the first run CNPG creates the role as soon
      # as the Secret appears, then the Database - so wait for that before calling the run done.
      - name: std-dive-gas-tracker database
        env:
          NS: std-dive-logger-${{ inputs.environment }}
        run: |
          set -euo pipefail
          if ! kubectl -n "$NS" get secret std-dive-gas-tracker-db-credentials >/dev/null 2>&1; then
            kubectl -n "$NS" create secret generic std-dive-gas-tracker-db-credentials \
              --type=kubernetes.io/basic-auth \
              --from-literal=username=std_dive_gas_tracker \
              --from-literal=password="$(openssl rand -hex 24)"
            kubectl -n "$NS" label secret std-dive-gas-tracker-db-credentials cnpg.io/reload=true
          fi
          kubectl -n "$NS" wait database.postgresql.cnpg.io/std-dive-gas-tracker \
            --for=jsonpath='{.status.applied}'=true --timeout=300s
