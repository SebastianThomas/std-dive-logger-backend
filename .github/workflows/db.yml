name: db
run-name: "provision DB ${{ inputs.environment }} @ ${{ inputs.tag }}"

# Provisions/reconciles the CNPG Postgres+PostGIS Cluster for one environment.
# Deliberately separate from the app deploy - on demand, repeatable, never a
# side effect of an app release. The legacy DB is replayed once from a dump
# right after the Cluster first goes Ready (see README).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's Cluster to provision/reconcile
        required: true
        type: choice
        options:
          - dev
          - prod
      tag:
        description: Tag/ref to read the db/ manifests from (e.g. v1.2.3)
        required: true
        type: string

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - id: tailnet
        uses: SebastianThomas/homelab-actions/headscale-connect@v1
        with:
          auth-key: ${{ secrets.TS_AUTHKEY }}
          login-server: ${{ secrets.HEADSCALE_URL }}
          ping: kube-cp-01
          hostname: gha-dive-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Diagnose Tailnet login failure
        if: failure() && steps.tailnet.outcome == 'failure'
        env:
          HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
        run: |
          if command -v tailscale >/dev/null; then
            sudo tailscale status --json | jq '{BackendState, Health}' || true
          fi
          curl --silent --show-error --connect-timeout 5 --max-time 15 \
            --output /dev/null --write-out 'Headscale health HTTP status: %{http_code}\n' \
            "${HEADSCALE_URL%/}/health" || true

      - name: "${{ inputs.environment }} Cluster"
        uses: SebastianThomas/homelab-actions/cnpg-cluster@v1
        with:
          server: ${{ secrets.KUBE_API }}
          ca: ${{ secrets.KUBE_CA }}
          token: ${{ secrets.KUBE_TOKEN }}
          namespace: std-dive-logger-${{ inputs.environment }}
          manifests: db/${{ inputs.environment }}
          timeout: 900s

      - name: Disconnect runner from Tailnet
        if: always() && steps.tailnet.outcome != 'skipped'
        run: |
          if command -v tailscale >/dev/null; then
            sudo tailscale logout || true
          fi
