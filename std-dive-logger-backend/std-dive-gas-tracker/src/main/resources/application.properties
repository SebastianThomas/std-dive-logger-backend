# LOCAL defaults (mvn spring-boot:run from this module dir). Deployed configs live in conf/<env>/
# (task P1) and replace this file entirely via SPRING_CONFIG_LOCATION - never rely on it there.
server.port=8090

spring.profiles.active=dev-login
spring.application.name=std-dive-gas-tracker-local

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.web.resources.add-mappings=false
server.servlet.encoding.force=true
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/plain
server.compression.min-response-size=2KB

logging.config=classpath:logback-spring.xml
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]

# Local DB: compose.yaml in this module dir (postgres on :5460), started by Spring Boot's
# docker-compose support. Tests use Testcontainers instead.
spring.docker.compose.lifecycle-management=start-only
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.flyway.locations=classpath:/db/migration/{vendor}

# Swagger UI / OpenAPI (task D8). Deployed configs set springdoc.api-docs.enabled=false.
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/docs/swagger-ui
springdoc.swagger-ui.displayRequestDuration=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Auth (API.md "Auth"): the dive logger's Ed25519 PUBLIC key(s), PEM (several, comma-separated,
# during a rotation). Local default = the LOCAL-DEV-ONLY pair from the dive logger's verification
# recipe (.claude/AGENTS.md, kid Wa7ygAapHp7mckBH), so a locally running dive logger's logins work
# here too; the dev-login key (profile dev-login) is accepted in addition. Never deploy this key;
# production values come from conf/<env> + the JWT_PUBLIC_KEY GitHub secret.
ch.sthomas.stddivegastracker.auth.public-keys=${STD_DIVE_LOGGER_WS_JWT_PUBLIC_KEY:-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAdHidNHgvBkVmD0m1NLKbeAJ/EazxXBUgNPrxZV2cyJc=\n-----END PUBLIC KEY-----}
ch.sthomas.stddivegastracker.auth.issuer=std-dive-logger
ch.sthomas.stddivegastracker.auth.require-email-verified-claim=false
ch.sthomas.stddivegastracker.auth.dev-login-enabled=true
ch.sthomas.stddivegastracker.cors.allowed-origins=https://localhost:5193,http://localhost:5193

server.tomcat.threads.min-spare=2
