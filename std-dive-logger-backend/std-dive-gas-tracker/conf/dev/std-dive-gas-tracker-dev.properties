# Deployed config (dev and prod; env-specific values come from the env below). Replaces
# src/main/resources/application.properties entirely: no dev-login, no demo-seed, no local key.
spring.application.name=std-dive-gas-tracker

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.web.resources.add-mappings=false
spring.mvc.log-resolved-exception=false
server.servlet.encoding.force=true
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/plain
server.compression.min-response-size=2KB

logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]
logging.structured.json.add.app_name=${spring.application.name}

spring.docker.compose.enabled=false

# Own database std_dive_gas_tracker and role in the dive logger's CNPG cluster std-dive-logger-db
# (secret std-dive-gas-tracker-db-credentials), never the dive logger's database.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.poolName=db-pool
spring.datasource.hikari.maximumPoolSize=6
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.flyway.locations=classpath:/db/migration/postgresql

# The API document is a build artifact (OpenApiSnapshotTest), not served in deployments.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.server.port=8085
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=60s

# Auth: only the dive logger's Ed25519 PUBLIC key (std-dive-logger-secrets/jwt-public-key, the
# JWT_PUBLIC_KEY GitHub secret). Dev login is off (the controller does not exist then).
ch.sthomas.stddivegastracker.auth.public-keys=${STD_DIVE_LOGGER_WS_JWT_PUBLIC_KEY}
ch.sthomas.stddivegastracker.auth.issuer=std-dive-logger
ch.sthomas.stddivegastracker.auth.require-email-verified-claim=true
ch.sthomas.stddivegastracker.auth.dev-login-enabled=false
ch.sthomas.stddivegastracker.cors.allowed-origins=${GAS_TRACKER_WEB_URL}

server.tomcat.threads.min-spare=2
