apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target: { kind: Deployment, name: std-dive-logger-ws }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 25m, memory: 512Mi }
          limits: { memory: 1280Mi }
  - target: { kind: HTTPRoute, name: std-dive-logger-ws }
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: ws.std-dive-logger-dev.sthomas.ch
