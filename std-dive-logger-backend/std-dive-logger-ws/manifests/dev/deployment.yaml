apiVersion: apps/v1
kind: Deployment
metadata:
    name: std-dive-logger-ws-dev
    namespace: std-dive-logger
spec:
    replicas: 1
    selector:
        matchLabels:
            app: std-dive-logger-ws-dev
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    template:
        metadata:
            labels:
                app: std-dive-logger-ws-dev
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/path: "/actuator/prometheus"
                prometheus.io/port: "8086"
        spec:
            nodeSelector:
                "kubernetes.io/os": linux
                "kubernetes.io/arch": amd64
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        # try not to schedule a pod in a HA zone if there is already a pod with label 'app' in ['std-dive-logger-ws-dev']
                        -   weight: 10
                            podAffinityTerm:
                                labelSelector:
                                    matchExpressions:
                                        -   key: app
                                            operator: In
                                            values:
                                                - std-dive-logger-ws-dev
                                topologyKey: topology.kubernetes.io/zone
                        -   weight: 50
                            podAffinityTerm:
                                labelSelector:
                                    matchExpressions:
                                        -   key: app
                                            operator: In
                                            values:
                                                - std-dive-logger-ws-dev
                                topologyKey: kubernetes.io/hostname
            containers:
                -   name: std-dive-logger-ws-dev
                    image: hub.docker.com/std-dive-logger-ws:PLACEHOLDER
                    imagePullPolicy: IfNotPresent
                    env:
                        -   name: SPRING_CONFIG_NAME
                            value: std-dive-logger-ws-dev
                        -   name: SPRING_CONFIG_LOCATION
                            value: /config/
                        -   name: LOGGING_CONFIG
                            value: /config/std-dive-logger-ws-dev-logback.xml
                    envFrom:
                        -   secretRef:
                                name: std-dive-logger-db-dev
                    ports:
                        -   containerPort: 8080
                    readinessProbe:
                        httpGet:
                            path: "/actuator/health/readiness"
                            port: 8086
                        failureThreshold: 2
                    livenessProbe:
                        httpGet:
                            path: "/actuator/health/liveness"
                            port: 8086
                        failureThreshold: 2
                    startupProbe:
                        httpGet:
                            path: "/actuator/health"
                            port: 8086
                        failureThreshold: 10
                        initialDelaySeconds: 10
                        periodSeconds: 10
                    resources:
                        requests:
                            cpu: 50m
                            memory: 512Mi
                        limits:
                            memory: 512Mi
                    volumeMounts:
                        -   name: config-volume
                            mountPath: /config/
                            readOnly: true
            imagePullSecrets:
                -   name: ub-acr-secret
            volumes:
                -   name: config-volume
                    configMap:
                        name: std-dive-logger-ws-dev-config
                        items:
                            -   key: std-dive-logger-ws-dev.properties
                                path: std-dive-logger-ws-dev.properties
                            -   key: std-dive-logger-ws-dev-logback.xml
                                path: std-dive-logger-ws-dev-logback.xml
