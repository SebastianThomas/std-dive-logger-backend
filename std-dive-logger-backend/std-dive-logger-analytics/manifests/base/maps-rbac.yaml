apiVersion: v1
kind: ServiceAccount
metadata:
  name: std-dive-logger-analytics
  labels:
    app.kubernetes.io/name: std-dive-logger-analytics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: std-dive-logger-osm-importer
  labels:
    app.kubernetes.io/name: osm2pgsql-import
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: std-dive-logger-maps-job-manager
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: std-dive-logger-maps-job-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: std-dive-logger-maps-job-manager
subjects:
  - kind: ServiceAccount
    name: std-dive-logger-analytics
