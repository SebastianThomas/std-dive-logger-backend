apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../conf/dev
  - deployment.yaml
  - analytics-tailnet.yaml
  - maps-rbac.yaml
patches:
  - path: analytics-tailnet-patch.yaml
configMapGenerator:
  # Consumed by the osm2pgsql import Job (MapsImportJobFactory mounts it by name),
  # so the name must stay stable - no content hash suffix.
  - name: std-dive-logger-osm-import
    options:
      labels:
        app.kubernetes.io/name: osm2pgsql-import
      disableNameSuffixHash: true
    files:
      - osm-import/boundaries.lua
      - osm-import/promote-boundaries.sql
