apiVersion: apps/v1
kind: Deployment
metadata:
  name: std-dive-logger-analytics
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: analytics
        - name: tailscale
          image: docker.io/tailscale/tailscale:v1.102.3
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef: {name: analytics-tailnet-authkey, key: authkey, optional: true}
            - {name: TS_EXTRA_ARGS, value: '--login-server=https://headscale.homelab.sthomas.ch'}
            - name: TS_HOSTNAME
              valueFrom: {configMapKeyRef: {name: std-dive-logger-env, key: ANALYTICS_TAILNET_HOSTNAME}}
            - {name: TS_USERSPACE, value: 'false'}
            - name: TS_DEST_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: TS_STATE_DIR, value: /var/lib/tailscale}
            - {name: TS_KUBE_SECRET, value: ''}
            - {name: TS_ACCEPT_DNS, value: 'false'}
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 160Mi}
          volumeMounts:
            - {name: tailnet-state, mountPath: /var/lib/tailscale}
            - {name: dev-net-tun, mountPath: /dev/net/tun}
        - name: tailnet-tls
          image: docker.io/nginx:1.31.5-alpine
          ports:
            - {name: tailnet-https, containerPort: 443}
          readinessProbe:
            tcpSocket: {port: tailnet-https}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx-tailnet.conf, readOnly: true}
            - {name: tailnet-tls, mountPath: /etc/nginx/tls, readOnly: true}
      volumes:
        - name: tailnet-state
          persistentVolumeClaim: {claimName: analytics-tailnet-state}
        - name: dev-net-tun
          hostPath: {path: /dev/net/tun, type: CharDevice}
        - name: tailnet-tls
          secret: {secretName: analytics-tailnet-tls}
