spring.application.name=std-dive-logger-analytics-dev

spring.jpa.open-in-view=false
spring.web.resources.add-mappings=false
spring.mvc.log-resolved-exception=false
server.servlet.encoding.force=true

logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]

spring.docker.compose.enabled=false

# database settings are injected via env vars/k8s secrets
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
spring.datasource.hikari.poolName=db-pool
spring.datasource.hikari.maximumPoolSize=8
spring.datasource.hikari.max-lifetime=600000
spring.flyway.locations=classpath:/db/migration/postgresql
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Maps uses an independent Flyway history and named connection. Kubernetes injects these values.
maps.enabled=${MAPS_ENABLED:false}
maps.datasource.url=${MAPS_DATASOURCE_URL:${SPRING_DATASOURCE_URL}}
maps.datasource.username=${MAPS_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
maps.datasource.password=${MAPS_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
maps.datasource.hikari.maximum-pool-size=2
maps.datasource.hikari.minimum-idle=0
maps.import.kubernetes.enabled=${MAPS_IMPORT_KUBERNETES_ENABLED:false}
maps.import.namespace=${MAPS_IMPORT_NAMESPACE:default}
maps.import.source-url=${MAPS_IMPORT_SOURCE_URL:https://download.geofabrik.de/europe/switzerland-latest.osm.pbf}
maps.import.source-checksum=${MAPS_IMPORT_SOURCE_CHECKSUM:}
maps.import.database-secret-name=${MAPS_IMPORT_DATABASE_SECRET_NAME:std-dive-logger-db-app}
maps.import.config-path=/maps-import-config

# Swagger UI properties (See: https://springdoc.org/#swagger-ui-properties)
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/docs/swagger-ui
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.defaultModelsExpandDepth=2
springdoc.swagger-ui.syntaxHighlight.theme=arta

# Prometheus
management.endpoints.web.exposure.include=*

management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.access=read_only

management.prometheus.metrics.export.enabled=true
management.observations.annotations.enabled=true

management.server.port=8088

spring.servlet.multipart.max-file-size=128KB
spring.servlet.multipart.max-request-size=128KB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${java.io.tmpdir}

ch.sthomas.stddivelogger.frontend.base-url=${FRONTEND_BASE_URL}
ch.sthomas.stddivelogger.storage.r2.base-url=${STD_DIVE_LOGGER_STORAGE_R2_BASE_URL}

# Shared HTTP observability (seconds in Prometheus; milliseconds in access logs).
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=60s
logging.structured.json.add.app_name=${spring.application.name}

# Settings previously maintained in the deployment copy.
management.endpoint.health.show-details=always

# UI listens only inside the pod; the tailnet TLS sidecar is its front door.
server.address=127.0.0.1
management.server.address=0.0.0.0
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=strict
spring.task.scheduling.pool.size=2
