server.port=8080

spring.profiles.active=no-security,local-output
spring.application.name=std-dive-logger-analytics-local

spring.jpa.open-in-view=false
spring.web.resources.add-mappings=false
server.servlet.encoding.force=true

logging.config=classpath:logback-spring.xml
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]

# Swagger UI properties (See: https://springdoc.org/#swagger-ui-properties)
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/docs/swagger-ui
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.defaultModelsExpandDepth=2
springdoc.swagger-ui.syntaxHighlight.theme=arta

# Database
spring.datasource.hikari.max-lifetime=600000
spring.flyway.locations=classpath:/db/migration/{vendor}

# Prometheus
management.endpoints.web.exposure.include=*
management.endpoint.health.probes.enabled=true
management.server.port=${server.port}

spring.servlet.multipart.max-file-size=128KB
spring.servlet.multipart.max-request-size=128KB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${java.io.tmpdir}

ch.sthomas.stddivelogger.frontend.base-url=https://localhost:5173
ch.sthomas.stddivelogger.storage.r2.base-url=${STD_DIVE_LOGGER_STORAGE_R2_BASE_URL}

# Shared HTTP observability (seconds in Prometheus; milliseconds in access logs).
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=60s
logging.structured.json.add.app_name=${spring.application.name}

# UI listens only inside the pod; the tailnet TLS sidecar is its front door.
server.address=127.0.0.1
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=strict
spring.task.scheduling.pool.size=2
