apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target: { kind: Deployment, name: std-dive-logger-import-ws }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 25m, memory: 192Mi }
          limits: { memory: 1024Mi }
  - target: { kind: HTTPRoute, name: std-dive-logger-import-ws }
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: std-dive-logger-importer-dev.sthomas.ch
      - op: replace
        path: /spec/hostnames/1
        value: importer.std-dive-logger-dev.sthomas.ch
