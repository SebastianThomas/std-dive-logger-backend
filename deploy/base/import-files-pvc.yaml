# Kept dive files (opt-in per account, see ImportFileStore), shared by ws, import-ws and analytics.
# local-path volumes are ReadWriteOnce and pinned to one node, so all three pods run on that node.
# Part of deploy/base, so every deploy creates it (and never prunes: kube-deploy only applies), in
# whichever namespace the overlay sets. See deploy/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: std-dive-logger-import-files
  labels:
    app.kubernetes.io/part-of: std-dive-logger
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
