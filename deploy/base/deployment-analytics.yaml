---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: std-dive-logger-analytics
  labels: { app: std-dive-logger-analytics }
spec:
  replicas: 1
  selector:
    matchLabels: { app: std-dive-logger-analytics }
  template:
    metadata:
      labels: { app: std-dive-logger-analytics }
    spec:
      containers:
        - name: analytics
          image: ${ANALYTICS_IMAGE}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mgmt, containerPort: 8088 }
          envFrom:
            - configMapRef: { name: std-dive-logger-env }
          env:
            - { name: SPRING_APPLICATION_NAME, value: std-dive-logger-analytics }
            - { name: ADDITIONAL_JAVA_OPTS, value: "-XX:MaxRAMPercentage=70.0" }
            - { name: SPRING_DATASOURCE_URL,      valueFrom: { secretKeyRef: { name: std-dive-logger-db-app, key: jdbc-uri } } }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: std-dive-logger-db-app, key: username } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: std-dive-logger-db-app, key: password } } }

          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: mgmt }
            periodSeconds: 5
            failureThreshold: 60          # up to 5 min for Flyway + JVM warmup
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: mgmt }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: mgmt }
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 896Mi }
