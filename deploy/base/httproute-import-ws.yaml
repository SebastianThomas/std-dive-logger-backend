---
# Base hostnames are the PROD ones - the dev overlay patches both to the -dev
# names. Two hostnames on purpose: the original flat one stays working, the
# importer. one is the readable alias (index order matters - the dev overlay
# patches /spec/hostnames/0 and /1 positionally).
# TLS: importer.std-dive-logger[-dev].sthomas.ch is two labels deep, so it
# needs a *.std-dive-logger[-dev].sthomas.ch cert on the Traefik websecure
# listener; the *.sthomas.ch wildcard only covers the flat name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: std-dive-logger-import-ws
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - std-dive-logger-importer.sthomas.ch
    - importer.std-dive-logger.sthomas.ch
  rules:
    - backendRefs:
        - name: std-dive-logger-import-ws
          port: 80
