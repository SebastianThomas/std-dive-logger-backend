---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: std-dive-logger-ws
  labels: { app: std-dive-logger-ws }
spec:
  replicas: 1
  selector:
    matchLabels: { app: std-dive-logger-ws }
  template:
    metadata:
      labels: { app: std-dive-logger-ws }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: /actuator/prometheus
    spec:
      volumes:
        - name: config
          configMap: { name: std-dive-logger-ws-config }
        - name: logs
          emptyDir: { sizeLimit: 200Mi }
      containers:
        - name: ws
          image: ${WS_IMAGE}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mgmt, containerPort: 8086 }
          volumeMounts:
            # jib only sets SPRING_CONFIG_LOCATION=/config/ - the config file
            # itself is this ConfigMap (copied from conf/dev; ${...} resolved
            # from the env below). SPRING_CONFIG_NAME picks it by its real name.
            - { name: config, mountPath: /config, readOnly: true }
            - { name: logs, mountPath: /logs }
          env:
            - { name: SPRING_CONFIG_LOCATION, value: "/config/" }
            - { name: SPRING_CONFIG_NAME, value: std-dive-logger-ws-dev }
            - { name: LOGGING_CONFIG, value: "/config/std-dive-logger-ws-dev-logback.xml" }
            - { name: SPRING_APPLICATION_NAME, value: std-dive-logger-ws }
            - { name: ADDITIONAL_JAVA_OPTS, value: "-XX:MaxRAMPercentage=70.0" }
            - { name: SPRING_DATASOURCE_URL,      valueFrom: { secretKeyRef: { name: std-dive-logger-db-app, key: jdbc-uri } } }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: std-dive-logger-db-app, key: username } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: std-dive-logger-db-app, key: password } } }
            - { name: STD_DIVE_LOGGER_WS_JWT_SECRET,         valueFrom: { secretKeyRef: { name: std-dive-logger-secrets, key: jwt-secret } } }
            - { name: STD_DIVE_LOGGER_WS_JWT_REFRESH_SECRET, valueFrom: { secretKeyRef: { name: std-dive-logger-secrets, key: jwt-refresh-secret } } }
            - { name: STD_DIVE_LOGGER_STORAGE_R2_ACCOUNT_ID, valueFrom: { secretKeyRef: { name: std-dive-logger-secrets, key: r2-account-id } } }
            - { name: STD_DIVE_LOGGER_STORAGE_R2_ACCESS_KEY, valueFrom: { secretKeyRef: { name: std-dive-logger-secrets, key: r2-access-key } } }
            - { name: STD_DIVE_LOGGER_STORAGE_R2_SECRET_KEY, valueFrom: { secretKeyRef: { name: std-dive-logger-secrets, key: r2-secret-key } } }
            - { name: PASSWORD,                              valueFrom: { secretKeyRef: { name: std-dive-logger-secrets, key: email-password } } }
            - { name: CH_STHOMAS_STDDIVELOGGER_PUSH_VAPID_PUBLIC_KEY, valueFrom: { secretKeyRef: { name: std-dive-logger-secrets, key: vapid-public-key } } }
            - { name: CH_STHOMAS_STDDIVELOGGER_WS_SERVICES_FEIGN_AUTOCOMPLETE_URL, value: "http://std-dive-logger-autocomplete" }
          envFrom:
            - configMapRef: { name: std-dive-logger-env }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: mgmt }
            periodSeconds: 5
            failureThreshold: 60          # up to 5 min for Flyway + JVM warmup
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: mgmt }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: mgmt }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 896Mi }
