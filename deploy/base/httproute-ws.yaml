---
# Base hostname is the PROD one - the dev overlay patches it to
# std-dive-logger-dev.sthomas.ch. TLS is the cluster *.sthomas.ch wildcard
# cert on the Traefik websecure listener - nothing per-app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: std-dive-logger-ws
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - std-dive-logger.sthomas.ch
  rules:
    - backendRefs:
        - name: std-dive-logger-ws
          port: 80
