---
# Base hostname is the PROD one - the dev overlay patches it to the -dev name.
# One label deep on purpose (std-dive-logger-autocomplete, not
# autocomplete.std-dive-logger) so the cluster *.sthomas.ch wildcard cert
# covers it with no per-app cert / acme-dns work. Traefik is the public edge.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: std-dive-logger-autocomplete
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - std-dive-logger-autocomplete.sthomas.ch
  rules:
    - backendRefs:
        - name: std-dive-logger-autocomplete
          port: 80
