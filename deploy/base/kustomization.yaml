apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Not applied directly - dev/ and prod/ overlay this with their namespace, the
# `std-dive-logger-env` ConfigMap (env-specific, non-secret ${...} values the
# mounted config references) and the HTTPRoute hostnames.
# `std-dive-logger-secrets` is created by the deploy workflow (kube-secret);
# `std-dive-logger-db-app` is CNPG's generated secret.
resources:
  - analytics-tailnet.yaml
  - ../../std-dive-logger-backend/std-dive-logger-ws/conf/dev
  - ../../std-dive-logger-backend/std-dive-logger-import-ws/conf/dev
  - ../../std-dive-logger-backend/std-dive-logger-analytics/conf/dev
  - ../../std-dive-logger-backend/std-dive-logger-autocomplete/conf/dev
  - namespace.yaml
  - deployment-ws.yaml
  - deployment-import-ws.yaml
  - deployment-autocomplete.yaml
  - deployment-analytics.yaml
  - service-ws.yaml
  - service-import-ws.yaml
  - service-autocomplete.yaml
  - httproute-ws.yaml
  - httproute-import-ws.yaml
  - httproute-autocomplete.yaml

# All four services fail fast (exit 1) if Postgres isn't up when Spring starts -
# on a fresh namespace CNPG is still initialising, so they'd crash-loop until it
# catches up. Gate every Deployment on the DB primary accepting connections.
patches:
  - path: analytics-tailnet-patch.yaml
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: wait-for-db
            image: busybox:1.37
            command:
              - sh
              - -c
              - 'until nc -z std-dive-logger-db-rw 5432; do echo "waiting for std-dive-logger-db-rw:5432"; sleep 2; done'
            resources:
              requests: { cpu: 10m, memory: 16Mi }
              limits: { memory: 32Mi }
