apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: std-dive-logger-prod
resources:
  - ../base

# Hostnames are the base ones, unpatched:
#   std-dive-logger.sthomas.ch / std-dive-logger-importer.sthomas.ch /
#   std-dive-logger-autocomplete.sthomas.ch
#
# TODO before the first prod deploy: confirm the prod R2 bucket + base URL
# (dev uses a throwaway bucket + the pub-*.r2.dev dev domain).
configMapGenerator:
  - name: std-dive-logger-env
    literals:
      - FRONTEND_BASE_URL=https://std-dive-logger-web.sthomas.ch
      - EXTRA_CORS_URLS=https://std-dive-logger-web.sthomas.ch
      - EMAIL=std-dive-logger@sthomas.ch
      - HOST=ha01s012.org-dns.com
      - STD_DIVE_LOGGER_STORAGE_R2_BUCKET=std-dive-logger
      - STD_DIVE_LOGGER_STORAGE_R2_BASE_URL=https://pub-15e4d0e285a44cf8b0f443fd6d5d5db9.r2.dev
