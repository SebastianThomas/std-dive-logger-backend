apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: std-dive-logger-dev
resources:
  - ../base

# Env-specific, non-secret values the baked conf/dev/*.properties resolve as
# ${...}. Secrets (jwt, r2 keys, email password) come from std-dive-logger-secrets
# (kube-secret); DB creds from std-dive-logger-db-app (CNPG).
configMapGenerator:
  - name: std-dive-logger-env
    literals:
      - FRONTEND_BASE_URL=https://std-dive-logger-web-dev.sthomas.ch
      - EXTRA_CORS_URLS=https://std-dive-logger-web-dev.sthomas.ch
      - EMAIL=std-dive-logger@sthomas.ch
      - HOST=ha01s012.org-dns.com
      - STD_DIVE_LOGGER_STORAGE_R2_BUCKET=std-dive-logger-dev
      - STD_DIVE_LOGGER_STORAGE_R2_BASE_URL=https://pub-15e4d0e285a44cf8b0f443fd6d5d5db9.r2.dev

patches:
  - target: { kind: HTTPRoute, name: std-dive-logger-ws }
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: std-dive-logger-dev.sthomas.ch
  - target: { kind: HTTPRoute, name: std-dive-logger-import-ws }
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: importer.std-dive-logger-dev.sthomas.ch
  - target: { kind: HTTPRoute, name: std-dive-logger-autocomplete }
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: autocomplete.std-dive-logger-dev.sthomas.ch
