apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: std-dive-logger-dev
resources:
  - ../base

# Env-specific, non-secret values. Secrets (jwt, r2 keys, email password, vapid
# keys) come from std-dive-logger-secrets (kube-secret); DB creds from
# std-dive-logger-db-app (CNPG).
configMapGenerator:
  - name: std-dive-logger-env
    literals:
      - FRONTEND_BASE_URL=https://std-dive-logger-web-dev.sthomas.ch
      # The frontend is served on BOTH hosts (see the web repo's HTTPRoute), so
      # both are real browser Origins - every API host must trust both.
      - EXTRA_CORS_URLS=https://std-dive-logger-web-dev.sthomas.ch,https://std-dive-logger-dev.sthomas.ch
      - EMAIL=std-dive-logger@sthomas.ch
      - HOST=ha01s012.org-dns.com
      - STD_DIVE_LOGGER_STORAGE_R2_BUCKET=std-dive-logger-dev
      - STD_DIVE_LOGGER_STORAGE_R2_BASE_URL=https://pub-15e4d0e285a44cf8b0f443fd6d5d5db9.r2.dev

patches:
  # Dev is for pre-prod testing, not load - run all four services on a much
  # smaller footprint than prod (base: 384Mi req / 896Mi lim). container[0] is
  # always the app; the heap tracks the limit (MaxRAMPercentage=70 -> ~448Mi).
  - target: { kind: Deployment }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 25m, memory: 192Mi }
          limits: { memory: 640Mi }

  # Hostnames are patched positionally - keep these indices in step with the
  # base HTTPRoutes' own hostname order.
  - target: { kind: HTTPRoute, name: std-dive-logger-ws }
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: ws.std-dive-logger-dev.sthomas.ch
  - target: { kind: HTTPRoute, name: std-dive-logger-import-ws }
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: std-dive-logger-importer-dev.sthomas.ch
      - op: replace
        path: /spec/hostnames/1
        value: importer.std-dive-logger-dev.sthomas.ch
  - target: { kind: HTTPRoute, name: std-dive-logger-autocomplete }
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: std-dive-logger-autocomplete-dev.sthomas.ch
      - op: replace
        path: /spec/hostnames/1
        value: autocomplete.std-dive-logger-dev.sthomas.ch
