apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: std-dive-logger-dev
resources:
  - ../base
  - ../../std-dive-logger-backend/std-dive-logger-ws/manifests/dev
  - ../../std-dive-logger-backend/std-dive-logger-import-ws/manifests/dev
  - ../../std-dive-logger-backend/std-dive-logger-autocomplete/manifests/dev
  - ../../std-dive-logger-backend/std-dive-logger-analytics/manifests/dev
components:
  - ../components/wait-for-db

# Env-specific, non-secret values. Secrets (jwt, r2 keys, email password, vapid
# keys) come from std-dive-logger-secrets (kube-secret); DB creds from
# std-dive-logger-db-app (CNPG).
configMapGenerator:
  - name: std-dive-logger-env
    literals:
      - ANALYTICS_TAILNET_HOSTNAME=std-dive-analytics-dev
      - FRONTEND_BASE_URL=https://std-dive-logger-web-dev.sthomas.ch
      # The frontend is served on BOTH hosts (see the web repo's HTTPRoute), so
      # both are real browser Origins - every API host must trust both.
      - EXTRA_CORS_URLS=https://std-dive-logger-web-dev.sthomas.ch,https://std-dive-logger-dev.sthomas.ch
      - EMAIL=std-dive-logger@sthomas.ch
      - HOST=ha01s012.org-dns.com
      - STD_DIVE_LOGGER_STORAGE_R2_BUCKET=std-dive-logger-dev
      - STD_DIVE_LOGGER_STORAGE_R2_BASE_URL=https://pub-15e4d0e285a44cf8b0f443fd6d5d5db9.r2.dev
