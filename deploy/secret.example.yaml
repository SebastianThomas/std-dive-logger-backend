# NOT applied by kustomize. `std-dive-logger-secrets` is created/updated by the
# deploy workflow via homelab-actions/kube-secret, from these GitHub repo
# secrets/variables (all environment-scoped: dev/prod, not repo-level):
#
#   JWT_SECRET                    (secret) -> jwt-secret
#   JWT_REFRESH_SECRET            (secret) -> jwt-refresh-secret
#   R2_ACCOUNT_ID                 (secret) -> r2-account-id
#   R2_ACCESS_KEY                 (secret) -> r2-access-key
#   R2_SECRET_KEY                 (secret) -> r2-secret-key
#   EMAIL_PASSWORD                (secret) -> email-password
#   VAPID_PRIVATE_KEY             (secret) -> vapid-private-key   (dev/prod: different key pairs)
#   VAPID_PUBLIC_KEY  (env variable, not secret - not sensitive) -> vapid-public-key
#   VAPID_SUBJECT     (env variable, not secret - not sensitive) -> vapid-subject
#
# Non-secret env-specific values (frontend URL, CORS, R2 bucket/base-url, email
# address + host) live in the `std-dive-logger-env` ConfigMap - see
# deploy/dev/kustomization.yaml and deploy/prod/kustomization.yaml.
#
# DB credentials come from CNPG's generated `std-dive-logger-db-app` Secret
# (see db/base/cluster.yaml), one per namespace.
#
# Manual create/rotate (needs a kubeconfig for the cluster):
#
#   kubectl -n std-dive-logger-dev create secret generic std-dive-logger-secrets \
#     --from-literal=jwt-secret='...' \
#     --from-literal=jwt-refresh-secret='...' \
#     --from-literal=r2-account-id='...' \
#     --from-literal=r2-access-key='...' \
#     --from-literal=r2-secret-key='...' \
#     --from-literal=email-password='...' \
#     --from-literal=vapid-public-key='...' \
#     --from-literal=vapid-private-key='...' \
#     --from-literal=vapid-subject='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: std-dive-logger-secrets
  namespace: std-dive-logger-dev   # or -prod
type: Opaque
stringData:
  jwt-secret: "change-me"
  jwt-refresh-secret: "change-me"
  r2-account-id: "change-me"
  r2-access-key: "change-me"
  r2-secret-key: "change-me"
  email-password: "change-me"
  vapid-public-key: "change-me"
  vapid-private-key: "change-me"
  vapid-subject: "change-me"
