apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: wait-for-db
            image: busybox:1.37
            command:
              - sh
              - -c
              - 'until nc -z std-dive-logger-db-rw 5432; do echo "waiting for std-dive-logger-db-rw:5432"; sleep 2; done'
            resources:
              requests: { cpu: 10m, memory: 16Mi }
              limits: { memory: 32Mi }
