apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: analytics-certificate-deployer
  namespace: std-dive-logger-dev
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: analytics-certificate-deployer
  namespace: std-dive-logger-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: analytics-certificate-deployer
subjects:
  - kind: ServiceAccount
    name: app-deployer
    namespace: ci
